<!DOCTYPE html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f6feb"><link rel="apple-touch-icon" href="icon-192.png"><title>Qiymət Təklifi</title>
<style>
:root{--bg:#f4f6fa;--c:#fff;--tx:#1b2430;--m:#6b7686;--bd:#dfe4ec;--p:#1f6feb;--p2:#e8f0fe;--d:#d64545}
@media(prefers-color-scheme:dark){:root{--bg:#12161d;--c:#1b222c;--tx:#e6eaf0;--m:#93a0b2;--bd:#2c3644;--p:#4c8dff;--p2:#1e2a40}}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 "Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--c);border-bottom:1px solid var(--bd);padding:8px 18px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:5}
header[hidden]{display:none}header b{margin-right:14px}header a{padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--tx)}header a.on{background:var(--p2);color:var(--p);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:18px}.card{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:19px}button{font:inherit;border:1px solid var(--bd);background:var(--c);color:var(--tx);padding:7px 13px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--p)}.p{background:var(--p);border-color:var(--p);color:#fff}.s{padding:3px 8px;font-size:12px}.x{color:var(--d)}
input,textarea,select{font:inherit;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:6px 8px;border-radius:7px;width:100%}
label{display:block;font-size:12px;color:var(--m);margin-bottom:2px}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--m);padding:6px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:4px;border-bottom:1px solid var(--bd)}.r{text-align:right}.m{color:var(--m)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>div{flex:1;min-width:130px}
.res{border:1px solid var(--bd);border-radius:8px;max-height:260px;overflow:auto;margin-top:4px}.res div{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--bd);display:flex;gap:8px}.res div:hover{background:var(--p2)}
.tot{max-width:360px;margin-left:auto}.tot div{display:flex;justify-content:space-between;padding:4px 0}.tot .g{font-size:18px;font-weight:700;border-top:2px solid var(--bd);margin-top:4px}
.t{position:fixed;bottom:18px;right:18px;background:var(--tx);color:var(--bg);padding:9px 15px;border-radius:9px}

async function unzip(b){const d=new DataView(b.buffer,b.byteOffset,b.byteLength);let e=b.length-22;while(d.getUint32(e,true)!==0x06054b50)e--;

const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t.push(c>>>0)}return t})();
const crc32=u=>{let c=-1;for(let i=0;i<u.length;i++)c=CT[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0};
function zip(files){const parts=[],cd=[];let off=0;const names=Object.keys(files);

  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nb.length,true);
  parts.push(new Uint8Array(h.buffer),nb,data);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x800,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
  cd.push(new Uint8Array(c.buffer),nb);off+=30+nb.length+data.length}
 const cl=cd.reduce((a,x)=>a+x.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,names.length,true);e.setUint16(10,names.length,true);e.setUint32(12,cl,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
const cn=s=>[...s].reduce((a,c)=>a*26+c.charCodeAt(0)-64,0);
const XE=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const LC=30; // AD sütunundan sağdakılar təmizlənir
const reRow=(x,nr,clear)=>x.replace(/^<row r="\d+"/,`<row r="${nr}"`).replace(/<c r="([A-Z]+)\d+"([^>]*?)(\/>|>[\s\S]*?<\/c>)/g,(m,c,at,rest)=>cn(c)>LC?'':clear?`<c r="${c}${nr}"${(at.match(/ s="\d+"/)||[''])[0]}/>`:`<c r="${c}${nr}"${at}${rest}`);
function setCell(x,ref,v,k){const re=new RegExp(`<c r="${ref}"([^>]*?)(?:\\/>|>[\\s\\S]*?<\\/c>)`),m=x.match(re);if(!m)return x;const s=(m[1].match(/ s="\d+"/)||[''])[0];

const N=v=>num(v)||0,money=n=>(n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₼';
const nm=s=>String(s||'').replace(/[İIı]/g,'i').replace(/[əƏ]/g,'e').replace(/[şŞ]/g,'s').replace(/[çÇ]/g,'c').replace(/[ğĞ]/g,'g').replace(/[öÖ]/g,'o').replace(/[üÜ]/g,'u').toLowerCase();
const toast=m=>{const t=document.createElement('div');t.className='t';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2500)};
let S;try{S=JSON.parse(localStorage.getItem('smeta')||'null')}catch(e){}
S=S||{id:1,est:[],mat:[{name:'Flanş DN100 (NÜMUNƏ)',unit:'ədəd',buy:18,sell:25,cat:'Fitinq'}],work:[{name:'Qaz rezakı ilə kəsmə (NÜMUNƏ)',unit:'ədəd',price:30,cat:'Qaynaq'}]};
const save=()=>{try{localStorage.setItem('smeta',JSON.stringify(S))}catch(e){alert('Yadda saxlamaq mümkün olmadı (brauzer icazə vermir).')}};
let V='list',E=null;
document.querySelectorAll('header a').forEach(a=>a.onclick=()=>{V=a.dataset.v;draw()});
const calc=e=>{let m=0,w=0,p=0;e.items.forEach(i=>{const q=N(i.qty);m+=q*N(i.mp);w+=q*N(i.wp);if(i.buy!=null&&i.mp!=='')p+=q*(N(i.mp)-N(i.buy))});const s=m+w,v=e.vat_on?s*N(e.vat_pct)/100:0;return{m,w,s,v,g:s+v,p}};
function nextNo(k){const C=CFG[k];let b=C.start-1;S.est.filter(e=>e.company===k).forEach(e=>{const x=(e.number.match(/(\d+)\s*$/)||[])[1];if(x)b=Math.max(b,+x)});return C.pre+String(b+1).padStart(5,'0')}
function draw(){if(V==='data'&&!isAdm())V='list';document.querySelectorAll('header a').forEach(a=>a.classList.toggle('on',a.dataset.v===V||(V==='edit'&&a.dataset.v==='list')));
 ({list:vList,new:vNew,edit:vEdit,mat:()=>vBase('mat'),work:()=>vBase('work'),data:vData,akt:vAkt})[V]()}
function vList(){const rows=[...S.est].filter(e=>isAdm()||e.by===ME().name).reverse();$('#m').innerHTML=`<h2>Təkliflər</h2><div class="card"><table><tr><th>Nömrə</th><th>Şirkət</th><th>Tarix</th><th>Məzmun</th><th class="r">Yekun</th><th></th></tr>
 ${rows.map(e=>`<tr><td><b>${esc(e.number)}</b><br><span class="m" style="font-size:11px">${esc(e.by||"")}</span></td><td>${CFG[e.company].label}</td><td>${e.date.split('-').reverse().join('.')}</td><td>${esc((e.subject||'').slice(0,60))}</td><td class="r">${money(calc(e).g)}</td>
 <td class="r" style="white-space:nowrap"><button class="s" onclick="openE(${e.id})">Aç</button> <button class="s" onclick="xl(${e.id})">Excel</button> <button class="s" onclick="cp(${e.id})">Kopyala</button> ${isAdm()?`<button class="s x" onclick="del(${e.id})">Sil</button>`:''}</td></tr>`).join('')||'<tr><td colspan=6 class="m">Hələ təklif yoxdur. "Yeni təklif" düyməsinə basın.</td></tr>'}</table></div>`}
const find=id=>S.est.find(e=>e.id===id);
const openE=id=>{E=JSON.parse(JSON.stringify(find(id)));V='edit';draw()};
function cp(id){const e=JSON.parse(JSON.stringify(find(id)));e.id=S.id++;e.by=ME().name;e.number=nextNo(e.company);e.date=new Date().toISOString().slice(0,10);S.est.push(e);save();draw();toast('Kopyalandı')}
function del(id){if(confirm('Silinsin?')){S.est=S.est.filter(e=>e.id!==id);save();draw()}}
async function xl(id){await dl(find(id))}
async function dl(e){try{const b=await fillXlsx(e.company,e,TPL),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=e.number.replace(/[^\w-]+/g,'_')+'.xlsx';a.click()}catch(x){alert('Excel yaradıla bilmədi: '+x.message)}}
function vNew(){$('#m').innerHTML='<h2>Yeni təklif</h2><div class="card"><p>Hansı şirkət şablonu?</p><div class="row">'+Object.entries(CFG).map(([k,c])=>`<div><button class="p" style="width:100%;padding:16px" onclick="mk('${k}')">${c.label}</button></div>`).join('')+'</div></div>'}
function mk(k){const C=CFG[k];E={id:null,by:ME().name,company:k,number:nextNo(k),date:new Date().toISOString().slice(0,10),subject:'',contact:C.contact,vat_on:true,vat_pct:18,notes:[...C.notes],items:[]};V='edit';draw()}
function vEdit(){$('#m').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Təklif: ${CFG[E.company].label}</h2><div style="flex:0"><button class="p" onclick="sv()">💾 Yadda saxla</button> <button onclick="sv(1)">📥 Excel yüklə</button></div></div>
 <div class="card"><div class="row"><div><label>Nömrə</label><input value="${esc(E.number)}" oninput="E.number=this.value"></div><div><label>Tarix</label><input type="date" value="${E.date}" oninput="E.date=this.value"></div><div><label>Əlaqə nömrəsi</label><input value="${esc(E.contact)}" oninput="E.contact=this.value"></div></div>
 <label style="margin-top:8px">Təklifin məzmunu</label><textarea rows="2" oninput="E.subject=this.value">${esc(E.subject)}</textarea></div>
 <div class="card"><label>Bazadan axtar (material və ya iş)</label><input id="q" placeholder="məs: flanş, kəsmə..." oninput="srch()" autocomplete="off"><div id="res"></div>
 <div style="margin:8px 0"><button class="s" onclick="addR()">+ Boş sətir</button></div><div style="overflow-x:auto"><table><thead><tr><th>№</th><th style="min-width:240px">Ad</th><th>Vahid</th><th>Miqdar</th><th>Material qiym.</th><th class="r">Məbləğ</th><th>İşçilik qiym.</th><th class="r">Məbləğ</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>
 <div class="row"><div class="card" style="flex:1"><label><input type="checkbox" style="width:auto" ${E.vat_on?'checked':''} onchange="E.vat_on=this.checked;tot()"> ƏDV tətbiq et</label><input style="width:80px;margin:4px 0" value="${E.vat_pct}" oninput="E.vat_pct=this.value;tot()"> %
 <label style="margin-top:8px">Qeydlər (hər sətir ayrı)</label><textarea rows="4" oninput="E.notes=this.value.split('\\n')">${esc(E.notes.join('\n'))}</textarea></div><div class="card tot" id="tot" style="flex:1"></div></div>`;rows();tot()}
const IN=(i,f,w)=>`<input style="width:${w}px" value="${esc(E.items[i][f]??'')}" oninput="E.items[${i}].${f}=this.value;tot()">`;
function rows(){$('#tb').innerHTML=E.items.map((it,i)=>`<tr><td>${i+1}</td><td><textarea rows="1" oninput="E.items[${i}].name=this.value">${esc(it.name)}</textarea></td><td>${IN(i,'unit',60)}</td><td>${IN(i,'qty',66)}</td><td>${IN(i,'mp',80)}</td><td class="r" id="a${i}"></td><td>${IN(i,'wp',80)}</td><td class="r" id="b${i}"></td>
 <td style="white-space:nowrap"><button class="s" onclick="mv(${i},-1)">↑</button><button class="s" onclick="mv(${i},1)">↓</button><button class="s x" onclick="E.items.splice(${i},1);rows();tot()">✕</button></td></tr>`).join('')||'<tr><td colspan=9 class="m" style="padding:16px">Yuxarıda axtarıb əlavə edin.</td></tr>'}
function mv(i,d){const j=i+d;if(j<0||j>=E.items.length)return;[E.items[i],E.items[j]]=[E.items[j],E.items[i]];rows();tot()}
function tot(){E.items.forEach((it,i)=>{const q=N(it.qty),a=$('#a'+i),b=$('#b'+i);if(a)a.textContent=it.mp===''?'':money(q*N(it.mp));if(b)b.textContent=it.wp===''?'':money(q*N(it.wp))});
 const t=calc(E);$('#tot').innerHTML=`<div><span>Material</span><span>${money(t.m)}</span></div><div><span>İşçilik</span><span>${money(t.w)}</span></div><div><span>Toplam</span><span>${money(t.s)}</span></div><div><span>ƏDV (${E.vat_on?E.vat_pct:0}%)</span><span>${money(t.v)}</span></div><div class="g"><span>Yekun</span><span>${money(t.g)}</span></div>${isAdm()&&t.p?`<div class="m" style="font-size:12px"><span>Material mənfəəti (Excel-də yoxdur)</span><span>${money(t.p)}</span></div>`:''}`}
const addR=it=>{E.items.push(it||{name:'',unit:'',qty:1,mp:'',wp:''});rows();tot()};
function srch(){const q=nm($('#q').value);const r=[...S.mat.map(x=>({...x,t:'M'})),...S.work.map(x=>({...x,t:'İ'}))].filter(x=>!q||nm(x.name+' '+(x.code||'')+' '+(x.cat||'')).includes(q)).slice(0,30);window._r=r;
 $('#res').innerHTML=r.length?'<div class="res">'+r.map((x,i)=>`<div onclick="pk(${i})"><span class="m">${x.t==='M'?'Material':'İş'}</span><span style="flex:1">${esc(x.name)}</span><span class="m">${esc(x.unit||'')}</span><b>${money(x.t==='M'?N(x.sell):N(x.price))}</b></div>`).join('')+'</div>':''}
function pk(i){const x=window._r[i];addR({name:x.name,unit:x.unit||'',qty:1,mp:x.t==='M'&&x.sell!==''?x.sell:'',wp:x.t==='İ'?x.price:'',buy:x.t==='M'&&isAdm()?x.buy:null});$('#q').value='';$('#res').innerHTML='';toast('Əlavə olundu')}
async function sv(x){E.items=E.items.filter(i=>String(i.name).trim());if(E.id){S.est[S.est.findIndex(e=>e.id===E.id)]=E}else{E.id=S.id++;S.est.push(E)}save();toast('Yadda saxlandı');if(x)await dl(E);rows();tot()}

function bt(k){const F=FLD[k].filter(f=>isAdm()||!['buy','supplier'].includes(f[0])),q=nm($('#bq').value);$('#bt').innerHTML='<tr>'+F.map(f=>`<th>${f[1]}</th>`).join('')+'<th></th></tr>'+S[k].map((r,i)=>[r,i]).filter(([r])=>!q||nm(Object.values(r).join(' ')).includes(q)).map(([r,i])=>'<tr>'+F.map(f=>`<td><input ${isAdm()?'':'disabled'} style="min-width:${f[0]==='name'?240:70}px" value="${esc(r[f[0]]??'')}" onchange="S['${k}'][${i}]['${f[0]}']=this.value;save()"></td>`).join('')+`<td>${isAdm()?`<button class="s x" onclick="S['${k}'].splice(${i},1);save();vBase('${k}')">✕</button>`:''}</td></tr>`).join('')}
function paste(k){const F=FLD[k];let n=0;$('#pa').value.split('\n').forEach(l=>{const c=l.split('\t');if(!(c[F.findIndex(f=>f[0]==='name')]||'').trim())return;const o={};F.forEach((f,i)=>o[f[0]]=(c[i]||'').trim());S[k].push(o);n++});save();vBase(k);toast(n+' sətir əlavə olundu')}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='smeta_ehtiyat_'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function rs(i){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.est||!d.mat)throw 0;d.users=d.users||S.users;S=d;save();V='list';draw();toast('Bərpa olundu')}catch(e){alert('Fayl uyğun deyil')}};r.readAsText(i.files[0])}
/* ===== Aktlar: Word şablonunu (.docx) doldurur ===== */
const WN='http://schemas.openxmlformats.org/wordprocessingml/2006/main',XN='http://www.w3.org/XML/1998/namespace';
const gt=(n,t)=>[...n.getElementsByTagNameNS(WN,t)];
const kids=(n,t)=>[...n.children].find(c=>c.localName===t);
function newRun(d,rpr,text){const r=d.createElementNS(WN,'w:r');if(rpr)r.append(rpr.cloneNode(true));text.split('\n').forEach((l,i)=>{if(i)r.append(d.createElementNS(WN,'w:br'));const t=d.createElementNS(WN,'w:t');t.setAttributeNS(XN,'xml:space','preserve');t.textContent=l;r.append(t)});return r}
function cellSet(tc,text,append){if(text==null||text==='')return;const d=tc.ownerDocument,ps=gt(tc,'p'),p=ps[0],rs=gt(p,'r');let rpr=null;
 if(rs.length)rpr=kids(rs[rs.length-1],'rPr');else{const pp=kids(p,'pPr');rpr=pp&&kids(pp,'rPr');if(rpr){const x=d.createElementNS(WN,'w:rPr');[...rpr.children].forEach(c=>x.append(c.cloneNode(true)));rpr=x}}
 if(rpr)rpr=rpr.cloneNode(true);if(!append){ps.slice(1).forEach(x=>x.remove());rs.forEach(x=>x.remove())}p.append(newRun(d,rpr,text))}
const rep=(root,re,v)=>gt(root,'t').forEach(t=>{if(re.test(t.textContent)){t.textContent=t.textContent.replace(re,()=>v);t.setAttributeNS(XN,'xml:space','preserve')}});
function check(tc,n){let c=0;for(const t of gt(tc,'t')){let s=t.textContent,i=-1;while((i=s.indexOf('☐',i+1))>=0){if(c++===n){t.textContent=s.slice(0,i)+'☒'+s.slice(i+1);return}}}}
const trs=t=>gt(t,'tr').filter(r=>r.parentNode===t),tcs=r=>[...r.children].filter(c=>c.localName==='tc');
const C=(t,r,c)=>tcs(trs(t)[r])[c];
function tblRows(tbl,n,fill){const R=trs(tbl),proto=R[1].cloneNode(true);R.slice(1).forEach(r=>r.remove());
 for(let i=0;i<Math.max(n,1);i++){const r=proto.cloneNode(true);tbl.append(r);fill(tcs(r),i)}}
const dmy=s=>s?s.split('-').reverse().join('.'):'';
async function mkDoc(key){const A=S.akt[key],f=await unzip(b64(DOCX[key])),d=new DOMParser().parseFromString(dec(f['word/document.xml']),'application/xml'),B=d.getElementsByTagNameNS(WN,'body')[0],K=[...B.children];
 if(key==='tehvil'){
  rep(K[1],/_+/,' '+dmy(A.date));if(A.alan)rep(K[2],/EDEN AGRO MMC/,A.alan);if(A.ver)rep(K[4],/CSH GROUP MMC/,A.ver);if(A.muq)rep(K[6],/_{3,}/,A.muq);
  tblRows(K[7],A.items.length,(c,i)=>{const it=A.items[i]||{};cellSet(c[0],String(i+1));cellSet(c[1],it.name||'');cellSet(c[2],it.unit||'');cellSet(c[3],String(it.qty??''))});
  if(!A.items.length)gt(K[7],'t').slice(-4).forEach(t=>t.textContent='');
 }else{
  if(A.scope)[K[1],K[26],K[57]].forEach(p=>rep(p,/…+/,A.scope));
  const t2=K[2];cellSet(C(t2,0,1),A.no);cellSet(C(t2,0,3),dmy(A.date));cellSet(C(t2,1,1),A.yer);cellSet(C(t2,1,3),A.obyekt);
  [['sif'],['pod'],['uc'],['num']].forEach((k,i)=>cellSet(C(K[5],i,1),A[k[0]]));
  [['ist','model'],['ad','seriya'],['guc','gerg'],['diger','qur']].forEach((k,i)=>{cellSet(C(K[7],i,1),A[k[0]]);cellSet(C(K[7],i,3),A[k[1]])});
  tblRows(K[10],A.items.length,(c,i)=>{const it=A.items[i]||{};cellSet(c[0],String(i+1));cellSet(c[1],it.name||'');if(it.st==='ok')check(c[2],0);if(it.st==='na')check(c[2],1);cellSet(c[3],it.note||'')});
  const r=['ok','bad','cond'].indexOf(A.result);if(r>=0)check(C(K[12],0,1),r);
  cellSet(C(K[12],1,1),A.defect);cellSet(C(K[12],2,1),A.todo);cellSet(C(K[12],3,1),A.notes);
  [['sif','sn','sv'],['pod','pn','pv'],['uc','un','uv']].forEach((k,col)=>{cellSet(C(K[30],1,col),' '+(A[k[0]]||''),1);cellSet(C(K[30],2,col),' '+(A[k[1]]||''),1);cellSet(C(K[30],3,col),' '+(A[k[2]]||''),1);if(A.date)rep(C(K[30],5,col),/_+ \/ _+ \/ _+/,dmy(A.date).replace(/\./g,' / '))});
 }
 f['word/document.xml']=enc('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+new XMLSerializer().serializeToString(d).replace(/^<\?xml[^>]*\?>\s*/,''));
 Object.keys(f).forEach(k=>{if(k.endsWith('/'))delete f[k]});return zip(f).slice(0,undefined,'application/vnd.openxmlformats-officedocument.wordprocessingml.document')}
async function dlAkt(k){try{const b=await mkDoc(k),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(k==='tehvil'?'Tehvil_teslim_akti_':'Test_protokolu_')+(S.akt[k].date||'')+'.docx';a.click()}catch(e){alert('Akt yaradıla bilmədi: '+e.message)}}
/* --- Aktlar səhifəsi --- */

 S.akt.test=S.akt.test||{date:today(),items:[{name:'',st:'ok',note:''}],result:''}}

const grp=(g,a)=>`<div class="row" style="margin-bottom:8px">${a.map(x=>fl(g,...x)).join('')}</div>`;

 $('#af').innerHTML=AT==='tehvil'?`${grp('tehvil',[['date','Tarix','date'],['alan','Təhvil alan (şirkət)'],['ver','Təhvil verən (şirkət)'],['muq','Müqavilə (nömrə, tarix)']])}
 <datalist id="co"><option>CSH GROUP MMC<option>NERA GROUP MMC</datalist>

 <table><thead><tr><th>№</th><th style="min-width:260px">Adı</th><th>Vahid</th><th>Miqdar</th><th></th></tr></thead><tbody>${A.tehvil.items.map((it,i)=>`<tr><td>${i+1}</td><td><textarea rows="1" oninput="S.akt.tehvil.items[${i}].name=this.value;save()">${esc(it.name)}</textarea></td><td><input style="width:70px" value="${esc(it.unit)}" oninput="S.akt.tehvil.items[${i}].unit=this.value;save()"></td><td><input style="width:70px" value="${esc(it.qty)}" oninput="S.akt.tehvil.items[${i}].qty=this.value;save()"></td><td><button class="s x" onclick="S.akt.tehvil.items.splice(${i},1);save();vAkt()">✕</button></td></tr>`).join('')}</tbody></table>
 <p><button class="s" onclick="S.akt.tehvil.items.push({name:'',unit:'ədəd',qty:1});save();vAkt()">+ Sətir</button></p>`
 :`${grp('test',[['no','Aktın №'],['date','Tarix','date'],['yer','Tərtib edildiyi yer'],['obyekt','Obyekt']])}${grp('test',[['scope','İşin / avadanlığın növü (məs. "Transformator"; sonra "test və yoxlama işləri üzrə" özü gəlir)']])}
 <h3>1. Tərəflər</h3>${grp('test',[['sif','Sifarişçi'],['pod','Podratçı'],['uc','Üçüncü tərəf']])}${grp('test',[['num','Nümayəndələrin iştirakı / digər qeyd','area']])}
 <h3>2. Avadanlıq</h3>${grp('test',[['ist','İstehsalçı'],['model','Model / Tip'],['ad','Avadanlığın adı'],['seriya','Seriya №']])}${grp('test',[['guc','Güc / kW'],['gerg','Gərginlik / V'],['diger','Digər identifikasiya'],['qur','Quraşdırıldığı yer']])}
 <h3>3. Test və yoxlama işləri</h3><table><thead><tr><th>№</th><th style="min-width:220px">İşin / testin adı</th><th>Status</th><th>Qeyd / Protokol №</th><th></th></tr></thead><tbody>${A.test.items.map((it,i)=>`<tr><td>${i+1}</td><td><textarea rows="1" oninput="S.akt.test.items[${i}].name=this.value;save()">${esc(it.name)}</textarea></td><td><select onchange="S.akt.test.items[${i}].st=this.value;save()">${[['ok','Yerinə yetirilib'],['na','Tətbiq edilmir'],['','(boş)']].map(o=>`<option value="${o[0]}" ${it.st===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></td><td><input value="${esc(it.note)}" oninput="S.akt.test.items[${i}].note=this.value;save()"></td><td><button class="s x" onclick="S.akt.test.items.splice(${i},1);save();vAkt()">✕</button></td></tr>`).join('')}</tbody></table>
 <p><button class="s" onclick="S.akt.test.items.push({name:'',st:'ok',note:''});save();vAkt()">+ Sətir</button></p>
 <h3>4. Nəticələr</h3><div class="row" style="margin-bottom:8px"><div><label>Testlərin ümumi nəticəsi</label><select onchange="S.akt.test.result=this.value;save()">${[['','(seçilməyib)'],['ok','Qənaətbəxşdir'],['bad','Qənaətbəxş deyil'],['cond','Şərti qəbul']].map(o=>`<option value="${o[0]}" ${A.test.result===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div></div>${grp('test',[['defect','Aşkar edilmiş uyğunsuzluqlar / qüsurlar','area'],['todo','Aradan qaldırılmalı işlər və son müddət','area'],['notes','Əlavə qeydlər','area']])}
 <h3>6. İmzalar</h3>${grp('test',[['sn','Sifarişçi: ad, soyad'],['sv','Sifarişçi: vəzifə'],['pn','Podratçı: ad, soyad'],['pv','Podratçı: vəzifə'],['un','Üçüncü tərəf: ad, soyad'],['uv','Üçüncü tərəf: vəzifə']])}`;
 if(AT==='tehvil')$('#af').querySelectorAll('input')[1].setAttribute('list','co'),$('#af').querySelectorAll('input')[2].setAttribute('list','co');
 $('#af').insertAdjacentHTML('beforeend',`<p><button class="p" onclick="dlAkt('${AT}')">📥 Word (.docx) yüklə</button> <span class="m">Boş buraxdığınız xanalar şablondakı kimi qalır (əllə doldurmaq üçün).</span></p>`)}
function fromEst(id){const e=S.est.find(x=>x.id==id);if(!e)return;S.akt.tehvil.items=e.items.map(i=>({name:i.name,unit:i.unit||'ədəd',qty:i.qty}));save();vAkt()}

/* ===== Giriş, rollar (admin / istifadəçi), tətbiq kimi yükləmə ===== */
const ME=()=>{try{return JSON.parse(sessionStorage.getItem('me')||'null')}catch(e){return null}};
const isAdm=()=>ME()?.role==='admin';
const rnd=()=>Math.random().toString(36).slice(2,12);
async function hp(pin,salt){try{const k=await crypto.subtle.importKey('raw',enc(pin),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc(salt),iterations:100000,hash:'SHA-256'},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=7;for(const c of salt+pin)h=Math.imul(31,h)+c.charCodeAt(0)|0;return'x'+h}}
const box=h=>{$('header').hidden=true;$('#m').innerHTML=`<div class="card" style="max-width:380px;margin:60px auto"><div style="text-align:center;margin-bottom:14px"><img src="data:image/png;base64,${LOGO.nera}" height="38"> <img src="data:image/png;base64,${LOGO.bolt}" height="38"></div>${h}</div>`};
async function boot(){if(!S.users||!S.users.length)return setupScreen();if(!ME())return loginScreen();
 $('header').hidden=false;$('#who').textContent=ME().name+' · '+(isAdm()?'admin':'istifadəçi');document.querySelector('[data-v=data]').hidden=!isAdm();draw()}
function setupScreen(){box(`<h2>İlk quraşdırma</h2><p class="m">Admin hesabı yaradın. Admin istifadəçiləri əlavə edir, bazaları və qiymətləri idarə edir.</p>
 <label>Admin adı</label><input id="u" value="admin"><label style="margin-top:8px">PIN (ən azı 4 simvol)</label><input id="p1" type="password"><label style="margin-top:8px">PIN təkrar</label><input id="p2" type="password">
 <p><button class="p" style="width:100%" onclick="doSetup()">Yarat və daxil ol</button></p><p class="m" style="font-size:12px">PIN-i unutsanız bərpa yolu yoxdur, yalnız brauzer məlumatlarını silmək (məlumat itir). Ona görə PIN-i yadda saxlayın və ehtiyat nüsxə yükləyin.</p>`)}
async function mkUser(name,pin,role){const salt=rnd();return{name:name.trim(),role,salt,hash:await hp(pin,salt)}}
async function doSetup(){const u=$('#u').value.trim(),a=$('#p1').value;if(!u||a.length<4)return alert('Ad və ən azı 4 simvolluq PIN daxil edin');if(a!==$('#p2').value)return alert('PIN-lər eyni deyil');
 S.users=[await mkUser(u,a,'admin')];save();sessionStorage.setItem('me',JSON.stringify({name:u,role:'admin'}));boot()}
function loginScreen(){box(`<h2>Giriş</h2><label>İstifadəçi</label><select id="u">${S.users.map(u=>`<option>${esc(u.name)}</option>`).join('')}</select><label style="margin-top:8px">PIN</label><input id="p" type="password" onkeydown="if(event.key==='Enter')doLogin()" autofocus>
 <p><button class="p" style="width:100%" onclick="doLogin()">Daxil ol</button></p>`)}
async function doLogin(){const u=S.users.find(x=>x.name===$('#u').value);if(u&&await hp($('#p').value,u.salt)===u.hash){sessionStorage.setItem('me',JSON.stringify({name:u.name,role:u.role}));boot()}else{await new Promise(r=>setTimeout(r,800));alert('PIN səhvdir');$('#p').value=''}}
function logout(){sessionStorage.removeItem('me');V='list';boot()}
/* --- Admin səhifəsi --- */
function vData(){$('#m').innerHTML=`<h2>Admin</h2><div class="card"><h3>İstifadəçilər</h3><table><tr><th>Ad</th><th>Rol</th><th></th></tr>${S.users.map((u,i)=>`<tr><td>${esc(u.name)}</td><td>${u.role==='admin'?'Admin':'İstifadəçi'}</td><td class="r"><button class="s" onclick="chPin(${i})">PIN dəyiş</button> ${u.name!==ME().name?`<button class="s x" onclick="rmUser(${i})">Sil</button>`:''}</td></tr>`).join('')}</table>
 <div class="row" style="margin-top:10px"><div><label>Yeni istifadəçi adı</label><input id="nu"></div><div><label>PIN</label><input id="np" type="password"></div><div><label>Rol</label><select id="nr"><option value="user">İstifadəçi</option><option value="admin">Admin</option></select></div><div style="flex:0"><button class="p" onclick="addUser()">Əlavə et</button></div></div>
 <p class="m" style="font-size:12px;margin-bottom:0"><b>İstifadəçi</b>: təklif və akt yaradır, Excel/Word yükləyir, yalnız öz təkliflərini görür, bazanı yalnız oxuyur (alış qiymətini görmür), silə bilmir. <b>Admin</b>: hər şey, o cümlədən baza, alış qiymətləri/mənfəət, bütün təkliflər, silmə.</p></div>
 <div class="card"><h3>Ehtiyat nüsxə</h3><p>Məlumatlar bu cihazın brauzerində saxlanılır. Vaxtaşırı ehtiyat nüsxə yükləyin.</p><p><button class="p" onclick="bk()">📥 Ehtiyat nüsxə yüklə</button> <label style="display:inline-block;border:1px solid var(--bd);padding:7px 13px;border-radius:8px;cursor:pointer">📤 Bərpa et<input type="file" accept=".json" hidden onchange="rs(this)"></label></p></div>
 <div class="card"><h3>Tətbiq kimi yükləmək</h3><p class="m">Kompüter (Chrome/Edge): ünvan sətrindəki ⊕ ikonu və ya yuxarıdakı "Tətbiq kimi yüklə" düyməsi. Android: ⋮ → "Tətbiqi quraşdır". iPhone (Safari): Paylaş → "Ana ekrana əlavə et". Yükləmə yalnız faylı internet ünvanından (https) açanda işləyir, fayldan birbaşa açanda yox.</p></div>`}
async function addUser(){const n=$('#nu').value.trim(),p=$('#np').value;if(!n||p.length<4)return alert('Ad və ən azı 4 simvolluq PIN daxil edin');if(S.users.some(u=>u.name.toLowerCase()===n.toLowerCase()))return alert('Bu ad artıq var');S.users.push(await mkUser(n,p,$('#nr').value));save();vData();toast('Əlavə olundu')}
async function chPin(i){const p=prompt('Yeni PIN (ən azı 4 simvol):');if(!p||p.length<4)return;S.users[i]=await mkUser(S.users[i].name,p,S.users[i].role);save();toast('PIN dəyişdi')}
function rmUser(i){if(S.users.filter(u=>u.role==='admin').length<2&&S.users[i].role==='admin')return alert('Ən azı bir admin qalmalıdır');if(confirm('İstifadəçi silinsin?')){S.users.splice(i,1);save();vData()}}
let DP;addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;$('#inst').hidden=false});
$('#inst').onclick=async()=>{if(DP){DP.prompt();DP=null;$('#inst').hidden=true}};
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

$("#l1").src="data:image/png;base64,"+LOGO.nera;$("#l2").src="data:image/png;base64,"+LOGO.bolt;
boot();
